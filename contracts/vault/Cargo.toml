[package]
name = "copytrade-vault"
description = "Per-user trading vault: bot may only swap through allowed DEXes, owner withdraws"
version = "2.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/rynzaro/copytrading-bot"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = "1"
serde_json = "1"

[workspace]
members = [".", "mocks/mock-ft", "mocks/mock-dex"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
